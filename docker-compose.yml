# Local development database. Values match backend/.env.example (never real credentials).
services:
  postgres:
    image: postgres:16-alpine
    container_name: cmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmp_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: cmp_db
    ports:
      - "5432:5432"
    volumes:
      - cmp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_user -d cmp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cmp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: change_me
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "5050:80"
    volumes:
      - cmp_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cmp_postgres_data:
  cmp_pgadmin_data:
