# Local development database. Values match backend/.env.example (never real credentials).
services:
  postgres:
    image: postgres:16-alpine
    container_name: cmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmp_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: cmp_db
    ports:
      # Puerto del host configurable: si ya tienes PostgreSQL instalado en tu equipo
      # usando el 5432, define POSTGRES_HOST_PORT=5433 en un .env junto a este archivo
      # y DB_PORT=5433 en backend/.env.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cmp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp_user -d cmp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cmp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: change_me
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "5050:80"
    volumes:
      - cmp_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: development
    container_name: cmp-api
    restart: unless-stopped
    # Copy backend/.env.example to backend/.env before the first run.
    env_file: ./backend/.env
    environment:
      # Fixed container port; the host port is chosen with API_HOST_PORT.
      PORT: "3000"
      # Inside the compose network the API reaches the postgres container,
      # even if backend/.env says localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
      # Polling watch so code changes on Windows/macOS volumes trigger the reload.
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    # Migrations first; the API only starts if they succeed.
    command: sh -c "npm run migration:run && npm run start:dev"
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      # Container's own node_modules: not hidden by the code mount nor mixed with the host's.
      - cmp_api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  cmp_postgres_data:
  cmp_pgadmin_data:
  cmp_api_node_modules:
